# Caspian & Black Sea Monitor Configuration
project:
  id: caspian-black-sea-monitor
  name: "Caspian & Black Sea Monitor"
  description: "Real-time vessel tracking, energy shipments, and maritime activity."

openrouter:
  model: "nvidia/nemotron-3-super-120b-a12b:free"
  fallback_model: "z-ai/glm-5.2:free"

news_query: "(Caspian OR Bosporus OR Dardanelles OR Odesa)"
include_forex: true

sources:
  - name: "Google News RSS"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
